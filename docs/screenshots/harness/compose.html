<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Figtree, "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: relative; overflow: hidden; }
  .warm { background:
      radial-gradient(1200px 600px at 10% -10%, #fff7ec 0%, transparent 60%),
      radial-gradient(900px 700px at 110% 110%, #ffd9c4 0%, transparent 60%),
      linear-gradient(135deg, #fff1e3 0%, #ffe3cf 55%, #ffd2bd 100%); }
  .night { background:
      radial-gradient(900px 500px at 0% 0%, #2a2018 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 100%, #3a1d10 0%, transparent 60%),
      linear-gradient(135deg, #16120f 0%, #1d1511 100%); }

  /* A window: slim title bar + the screenshot, rounded, with a soft shadow. */
  .window { border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 40px 80px -20px rgba(120, 45, 0, 0.35), 0 12px 24px -8px rgba(120, 45, 0, 0.18), 0 0 0 1px rgba(0,0,0,0.06); }
  .night .window { background: #1c1c1c; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,0.08); }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #f3f3f3; border-bottom: 1px solid rgba(0,0,0,.06); }
  .night .bar { background: #262626; border-bottom-color: rgba(255,255,255,.06); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .bar i:nth-child(1) { background: #ff5f57; } .bar i:nth-child(2) { background: #febc2e; } .bar i:nth-child(3) { background: #28c840; }
  .bar span { flex: 1; text-align: center; margin-right: 50px; font-size: 12.5px; color: #8a8a8a; }
  .window img { display: block; }

  /* A phone: dark bezel, then a 390×844 screen (status bar, the narrow screenshot, home indicator)
     drawn at full CSS size and scaled down as a whole, so it keeps a real phone's proportions. */
  .phone { position: absolute; border-radius: 58px; padding: 13px; background: #111; transform-origin: top left;
    box-shadow: 0 60px 110px -25px rgba(90, 30, 0, .55), 0 0 0 2px #2a2a2a inset; }
  .screen { width: 390px; height: 844px; border-radius: 46px; overflow: hidden; background: #fdfdfd; position: relative; }
  .screen img { display: block; width: 390px; }
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 40px;
    font: 600 16px/1 -apple-system, "SF Pro Text", Figtree, sans-serif; color: #111; }
  .status svg { display: block; }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .home { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #111; }

  .tag { font-size: 30px; line-height: 1.35; color: #3b2a20; font-weight: 500; margin: 0; }
  .sub { font-size: 20px; color: #7a5a48; margin: 14px 0 0; }
  .pills { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .pills span { font-size: 16px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.7); color: #6b3d22; box-shadow: 0 0 0 1px rgba(160,70,20,.15); }
</style>
</head>
<body>
<script>
  // ?kind=frame&img=overview.png&w=900&title=… | hero | phones&imgs=a,b,c | social ; &theme=night for a dark backdrop
  const q = new URLSearchParams(location.search);
  const kind = q.get("kind");
  const theme = q.get("theme") === "night" ? "night" : "warm";
  const win = (src, w, title = "Home Assistant · Snug") =>
    `<div class="window" style="width:${w}px"><div class="bar"><i></i><i></i><i></i><span>${title}</span></div><img src="${src}" width="${w}"></div>`;

  const phone = (src, left, top, scale) => `
    <div class="phone" style="left:${left}px;top:${top}px;transform:scale(${scale})"><div class="screen">
      <div class="status"><span>9:41</span><span class="island"></span>
        <svg width="72" height="14" viewBox="0 0 72 14" fill="#111"><rect x="0" y="9" width="3.5" height="5" rx="1"/><rect x="5.5" y="6" width="3.5" height="8" rx="1"/><rect x="11" y="3" width="3.5" height="11" rx="1"/><rect x="16.5" y="0" width="3.5" height="14" rx="1"/>
          <path d="M35 13.5l-2.6-2.6a3.7 3.7 0 0 1 5.2 0zM30.5 9a6.4 6.4 0 0 1 9 0l1.5-1.5a8.5 8.5 0 0 0-12 0zM27.5 6a10.6 10.6 0 0 1 15 0L44 4.5a12.7 12.7 0 0 0-18 0z"/>
          <rect x="47.5" y="1" width="21" height="12" rx="3.5" fill="none" stroke="#111" stroke-opacity=".4"/><rect x="49.5" y="3" width="15" height="8" rx="2"/><rect x="69.5" y="5" width="1.8" height="4" rx=".9" fill-opacity=".4"/></svg></div>
      <img src="${src}"><div class="home"></div>
    </div></div>`;

  if (kind === "frame") {
    const w = +q.get("w") || 900, pad = 56;
    document.body.innerHTML = `<div class="stage ${theme}" style="display:inline-block;padding:${pad}px ${pad + 8}px ${pad + 16}px">${win(q.get("img"), w)}</div>`;
  } else if (kind === "hero") {
    document.body.innerHTML = `
      <div class="stage warm" style="width:1400px;height:860px">
        <div style="position:absolute;left:64px;top:58px">${win("overview.png", 980)}</div>
        ${phone("phone.png", 1012, 52, 0.86)}
      </div>`;
  } else if (kind === "phones") {
    // Three phones side by side: ?imgs=a.png,b.png,c.png
    const imgs = (q.get("imgs") || "").split(",");
    document.body.innerHTML = `
      <div class="stage warm" style="width:1400px;height:900px">
        ${imgs.map((src, i) => phone(src, 92 + i * 424, 56, 0.92)).join("")}
      </div>`;
  } else if (kind === "social") {
    document.body.innerHTML = `
      <div class="stage warm" style="width:1280px;height:640px">
        <div style="position:absolute;left:84px;top:150px;width:520px">
          <img src="${q.get("logo")}" height="96">
          <p class="tag" style="margin-top:34px">Local control of Hive heating and hot water in Home Assistant.</p>
          <p class="sub">No Hive cloud. No Hive hub. Schedules live on the receiver.</p>
          <div class="pills"><span>Zigbee2MQTT</span><span>ZHA</span><span>Schedules</span><span>Boost</span></div>
        </div>
        <div style="position:absolute;left:690px;top:84px">${win("overview.png", 760)}</div>
      </div>`;
  }
  document.title = "ready";
</script>
</body>
</html>
