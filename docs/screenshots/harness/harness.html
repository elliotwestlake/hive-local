<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Home Assistant's default light theme (the variables the panel reads). */
  :root {
    --primary-color: #03a9f4;
    --accent-color: #ff9800;
    --primary-background-color: #fafafa;
    --secondary-background-color: #e5e5e5;
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --text-primary-color: #ffffff;
    --disabled-text-color: #bdbdbd;
    --divider-color: rgba(0, 0, 0, 0.12);
    --app-header-background-color: #ffffff;
    --app-header-text-color: #212121;
    --app-header-border-bottom: 1px solid rgba(0, 0, 0, 0.12);
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
    --state-climate-heat-color: #ff8100;
    --state-water_heater-color: #2196f3;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: none;
    --ha-font-family-body: Roboto, "Noto Sans", sans-serif;
  }
  :root.dark {
    --primary-background-color: #111111;
    --secondary-background-color: #282828;
    --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --disabled-text-color: #6f6f6f;
    --divider-color: rgba(225, 225, 225, 0.12);
    --app-header-background-color: #1c1c1c;
    --app-header-text-color: #e1e1e1;
    --app-header-border-bottom: 1px solid rgba(225, 225, 225, 0.12);
  }
  html, body { margin: 0; height: 100%; background: var(--primary-background-color); }
  hive-local-panel { display: block; min-height: 100%; }
  ha-icon { display: inline-flex; }
  ha-icon svg { width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); fill: currentColor; }
</style>
</head>
<body>
<script type="module" src="harness.js"></script>
</body>
</html>
