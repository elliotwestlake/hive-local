boost_heating:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    minutes:
      selector:
        number:
          min: 1
          max: 360
          step: 1
          unit_of_measurement: min
    temperature:
      selector:
        number:
          min: 5
          max: 32
          step: 0.5
          unit_of_measurement: "°C"

boost_water:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    minutes:
      selector:
        number:
          min: 1
          max: 360
          step: 1
          unit_of_measurement: min

cancel_boost_heating:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local

cancel_boost_water:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local

set_holiday:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    until:
      required: true
      selector:
        datetime:
    temperature:
      selector:
        number:
          min: 5
          max: 32
          step: 0.5
          unit_of_measurement: "°C"

cancel_holiday:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local

test_timed_hold:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    temperature:
      default: 12
      selector:
        number:
          min: 5
          max: 32
          step: 0.5
          unit_of_measurement: "°C"
    minutes:
      default: 10
      selector:
        number:
          min: 2
          max: 60
          step: 1
          unit_of_measurement: min
