boost_heating:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    minutes:
      selector:
        number:
          min: 1
          max: 360
          step: 1
          unit_of_measurement: min
    temperature:
      selector:
        number:
          min: 5
          max: 32
          step: 0.5
          unit_of_measurement: "°C"

boost_water:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
    minutes:
      selector:
        number:
          min: 1
          max: 360
          step: 1
          unit_of_measurement: min

cancel_boost_heating:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local

cancel_boost_water:
  fields:
    device_id:
      selector:
        device:
          integration: hive_local
