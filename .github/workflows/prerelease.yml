name: Pre-release
# Publishes a GitHub pre-release for the version in manifest.json from a pull request's
# branch: normally release-please's release PR (release-please.yml), whose notes it uses.
# branch, so it can be tested through the Marketplace (with beta versions shown) before it
# reaches main. Add the `pre-release` label to the PR to publish. Each later push to a
# labelled PR publishes it again from the new head: a pre-release of the same version is
# deleted (with its tag) and recreated, so it always matches the PR. A full release of that
# version is never touched. It can also be run by hand on any branch.
# Merging the release PR replaces it with the real release (release-please.yml).
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  prerelease:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'pre-release') &&
       (github.event.action != 'labeled' || github.event.label.name == 'pre-release'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Publish (or republish) the pre-release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/hive_local/manifest.json"))["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
              echo "::notice::$tag is already a full release. Bump the version in manifest.json to publish another."
              exit 0
            fi
            if [ "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$SHA" ]; then
              echo "::notice::$tag is already published from $SHA."
              exit 0
            fi
            # Replace the pre-release (and its tag) so it's built from this commit.
            gh release delete "$tag" --cleanup-tag --yes
          fi
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --target "$SHA" --title "$tag" --prerelease --notes-file "$notes"
          elif [ -n "$PR" ]; then
            # The PR's description: on a release PR, release-please's notes for this version.
            gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --target "$SHA" --title "$tag" --prerelease --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --target "$SHA" --title "$tag" --prerelease --generate-notes
          fi
          echo "::notice::Published $tag as a pre-release from $SHA"
