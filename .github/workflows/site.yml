name: Site

# Checks the marketing site and docs (site/) still build. Cloudflare deploys them itself
# through its GitHub integration (main → production, other branches → previews): root
# directory `site`, build command `npm run build`, deploy command `npx wrangler deploy`,
# which reads site/wrangler.jsonc.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/*.png", "docs/logo/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/screenshots/*.png", "docs/logo/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
