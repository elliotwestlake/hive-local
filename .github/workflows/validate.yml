name: Validate
# workflow_dispatch: release-please.yml starts it on the release PR's branch, since a PR
# opened with the built-in token doesn't trigger pull_request workflows.
on: [push, pull_request, workflow_dispatch]
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  tests:
    # The pure tests and tests/e2e (Home Assistant core with the integration loaded),
    # against the Home Assistant version requirements_test.txt pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest -q tests
  frontend:
    # The panel bundle is committed; fail if it isn't what the source builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --exit-code --stat -- custom_components/hive_local/frontend/; then
            echo "::error title=Panel bundle out of date::Run 'npm run build' in frontend/ and commit hive-local-panel.js."
            exit 1
          fi
