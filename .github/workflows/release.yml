name: Release
# Publishes a GitHub release (and its tag) for the version in manifest.json once it reaches
# main, if that version hasn't been released yet. The Marketplace (formerly HACS) offers
# GitHub releases as updates. Notes come from docs/releases/vX.Y.Z.md when it exists.
# A version already published as a pre-release (prerelease.yml) is promoted instead.
on:
  push:
    branches: [main]
    paths:
      - custom_components/hive_local/manifest.json
      - docs/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if this version hasn't been released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("custom_components/hive_local/manifest.json"))["version"])')
          tag="v$version"
          if prerelease=$(gh release view "$tag" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$prerelease" = "true" ]; then
              # Tested as a pre-release (prerelease.yml) and now merged: make it the release.
              gh release edit "$tag" --prerelease=false --latest
              echo "$tag promoted from pre-release"
            else
              echo "$tag is already released"
            fi
            exit 0
          fi
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
